<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ノブロック紹介帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ノブロック帳">
<meta name="theme-color" content="#43bde8">
<link rel="apple-touch-icon" href="icon-v1-180.png">
<link rel="icon" href="icon-v1-180.png">
<style>
:root{--bg:#fffbe6;--card:#fff;--ink:#2a1d1a;--sub:#7a6a60;--line:#eadfc8;--blue:#43bde8;--blue-l:#e3f5fc;--yel:#f6e23e;--yel-l:#fff6c2;--pink:#ff7a8c;--pink-l:#ffe6ea;--grn:#38ad94;--grn-l:#e0f5ef;--pur:#b487d6;--pur-l:#f2e9fa}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--blue);padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;border-bottom:4px solid var(--ink)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:42px;height:42px;border-radius:11px;border:3px solid var(--ink);background:#fff}
h1{margin:0;font-size:20px;color:#fff;letter-spacing:.04em;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.ver{margin-left:auto;font-size:11px;color:#fff;opacity:.9}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.tab.on{background:var(--yel)}
.tab b{font-size:11px;font-weight:400;margin-left:3px;color:var(--sub)}
.bar{padding:10px 16px 4px;display:flex;flex-direction:column;gap:8px}
input[type=search]{width:100%;font-size:16px;padding:9px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--blue-l)}
.count{font-size:12px;color:var(--sub)}
main{padding:4px 16px 40px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.card{min-width:0;overflow-wrap:anywhere;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;position:relative}
.card.c店{box-shadow:5px 5px 0 var(--yel)}
.card.cレシピ{box-shadow:5px 5px 0 var(--pink)}
.card.c商品{box-shadow:5px 5px 0 var(--grn)}
.card.c作品{box-shadow:5px 5px 0 var(--pur)}
.card.done{opacity:.6}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin:0 4px 4px 0;border:1.5px solid var(--ink)}
.t店{background:var(--yel-l)}.tレシピ{background:var(--pink-l)}.t商品{background:var(--grn-l)}.t作品{background:var(--pur-l)}
.tg{background:#fff}
.st{background:#fff;color:var(--sub);border-color:var(--line)}
.st.end{background:#eee}
.name{font-size:17px;font-weight:800;margin:2px 0 4px;line-height:1.35;padding-right:36px}
.item{font-size:14px;line-height:1.5;margin:0 0 6px}
.meta{font-size:12px;color:var(--sub);line-height:1.6}
.hours{font-size:12px;background:var(--blue-l);border-radius:8px;padding:6px 8px;margin-top:6px;line-height:1.55}
.note{font-size:12px;margin-top:4px;color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btns a,.btns button{font-size:13px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-family:inherit}
.btns a.play{background:var(--pink-l)}
.btns button.on{background:var(--yel)}
.star{position:absolute;top:8px;right:10px;border:none;background:none;font-size:24px;line-height:1;color:#d8ccb6;padding:4px}
.star.on{color:#ffb400}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:40px 0}
footer{padding:0 16px 30px;font-size:11px;color:var(--sub);line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="top"><img src="icon-v1-180.png" alt=""><h1>ノブロック紹介帳</h1><span class="ver">v2</span></div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="店・料理・作品・出演者で検索">
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
</div>
<main id="list"></main>
<footer>
  YouTube「佐久間宣行のNOBROCK TV」の概要欄・字幕から、紹介された店・商品・作品をまとめた個人用メモです（2026年11月24日(火)時点、動画515本）。営業時間はネットの掲載情報なので、行く前に店へ確認してください。
</footer>
<script src="data-v2.js"></script>
<script>
const CATS=[["すべて",""],["店","店"],["レシピ","レシピ"],["商品","商品"],["作品","作品"],["☆気になる","star"]];
const KEY="nobrock-list-v1";
let mark={};try{mark=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mark))}catch(e){}}
let cat="店",chip="",q="";
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inCat(x){return cat==="star"?mark[x.id]?.s:(!cat||x.cat===cat)}
function chipKey(x){return x.cat==="店"?(x.area.split("（")[0]):x.cat==="作品"?x.date.slice(0,4)+"年":x.genre}
function renderTabs(){
  $("tabs").innerHTML=CATS.map(([l,v])=>{const n=DATA.filter(x=>v==="star"?mark[x.id]?.s:(!v||x.cat===v)).length;
    return `<button class="tab ${cat===v?"on":""}" data-v="${v}">${l}<b>${n}</b></button>`}).join("");
}
function renderChips(){
  const keys=[...new Set(DATA.filter(inCat).map(chipKey))].filter(Boolean).sort();
  $("chips").innerHTML=(keys.length>1?[`<button class="chip ${!chip?"on":""}" data-k="">ぜんぶ</button>`,...keys.map(k=>`<button class="chip ${chip===k?"on":""}" data-k="${esc(k)}">${esc(k)}</button>`)]:[]).join("");
}
function card(x){
  const m=mark[x.id]||{};
  const url=x.vid?`https://www.youtube.com/watch?v=${x.vid}${x.t?`&t=${x.t}s`:""}`:"";
  const tm=x.t?`（${Math.floor(x.t/60)}分${String(x.t%60).padStart(2,"0")}秒〜）`:"";
  const map=x.cat==="店"&&!/期間限定/.test(x.area)?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name+" "+x.area.replace(/（|）/g," "))}`:"";
  const doneL=x.cat==="作品"?"見た":x.cat==="商品"?"買った":x.cat==="レシピ"?"作った":"行った";
  return `<div class="card c${x.cat} ${m.d?"done":""}">
<button class="star ${m.s?"on":""}" data-star="${x.id}" aria-label="気になる">★</button>
<span class="tag t${x.cat}">${x.cat}</span><span class="tag tg">${esc(x.genre)}</span>${x.st?`<span class="tag st ${x.st==="終了"?"end":""}">${esc(x.st)}</span>`:""}
<div class="name">${esc(x.name)}</div>
<p class="item">${esc(x.item)}</p>
<div class="meta">${x.area?`場所: ${esc(x.area)}<br>`:""}${x.by?`紹介: ${esc(x.by)}<br>`:""}${x.vid?`${esc(x.date)}「${esc(x.vt)}」`:""}</div>
${x.hours?`<div class="hours">${esc(x.hours)}</div>`:""}${x.note?`<div class="note">${esc(x.note)}</div>`:""}
<div class="btns">${url?`<a class="play" href="${url}" target="_blank" rel="noopener">▶ 動画${tm}</a>`:""}${map?`<a href="${map}" target="_blank" rel="noopener">地図</a>`:""}${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">公式・注文</a>`:""}<button class="${m.d?"on":""}" data-done="${x.id}">${m.d?"✓ ":""}${doneL}</button></div>
</div>`;
}
function render(){
  renderTabs();renderChips();
  const w=q.trim().toLowerCase();
  const list=DATA.filter(x=>inCat(x)&&(!chip||chipKey(x)===chip)&&(!w||[x.name,x.item,x.genre,x.area,x.by,x.vt,x.note].join(" ").toLowerCase().includes(w)));
  if(cat==="作品")list.sort((a,b)=>b.date.localeCompare(a.date)||a.t-b.t);
  $("count").textContent=`${list.length}件`;
  $("list").innerHTML=list.length?list.map(card).join(""):`<div class="empty">${cat==="star"?"★を押すとここに集まります":"見つかりませんでした"}</div>`;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.v!==undefined){cat=t.dataset.v;chip="";render();window.scrollTo(0,0)}
  else if(t.dataset.k!==undefined){chip=t.dataset.k;render()}
  else if(t.dataset.star){const id=t.dataset.star;mark[id]={...mark[id],s:!mark[id]?.s};save();render()}
  else if(t.dataset.done){const id=t.dataset.done;mark[id]={...mark[id],d:!mark[id]?.d};save();render()}
});
$("q").addEventListener("input",e=>{q=e.target.value;render()});
render();
</script>
</body>
</html>
