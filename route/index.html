<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルートチェンジ">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ルートチェンジ・カレンダー</title>
<style>
  :root {
    --bg-a: #fff2d6; --bg-b: #ffe1ec; --bg-c: #dcefff;
    --surface: #fffaf3; --text: #3a2b3f; --text-muted: #8d7387; --accent: #ff5b8c;
    --status-normal: #2fae63; --status-caution: #ef8c2c; --status-closed: #ef4f63; --status-crowded: #8a5fd6;
    --card-asakusa: #ffe9c7; --card-omiya: #dff5e3; --card-ikebukuro: #ffdce6; --card-takadanobaba: #dcecff;
    --shadow: 0 10px 30px rgba(180, 90, 120, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-a: #241832; --bg-b: #2b1830; --bg-c: #16212f;
      --surface: #1c1420; --text: #f3ecf7; --text-muted: #b6a3c2; --accent: #ff8fb2;
      --status-normal: #4bcf8f; --status-caution: #ffab5c; --status-closed: #ff8a97; --status-crowded: #b79bf0;
      --card-asakusa: #3a2c1c; --card-omiya: #1d3324; --card-ikebukuro: #3a1f2a; --card-takadanobaba: #1a2b40;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  header { margin-bottom: 18px; }
  .app-title { font-weight: 800; font-size: 1.6rem; margin: 0 0 6px; }
  .app-sub { font-size: .85rem; color: var(--text-muted); line-height: 1.6; margin: 0; font-variant-numeric: tabular-nums; }
  .list { display: flex; flex-direction: column; gap: 14px; }
  .card { border-radius: 22px; padding: 18px 18px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
  .card[data-store="asakusa"] { background: var(--card-asakusa); }
  .card[data-store="omiya"] { background: var(--card-omiya); }
  .card[data-store="ikebukuro"] { background: var(--card-ikebukuro); }
  .card[data-store="takadanobaba"] { background: var(--card-takadanobaba); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .store-name { font-weight: 700; font-size: 1.2rem; }
  .badge { font-size: .78rem; font-weight: 700; padding: 5px 13px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .badge.normal  { background: var(--status-normal); }
  .badge.caution { background: var(--status-caution); }
  .badge.closed  { background: var(--status-closed); }
  .badge.crowded { background: var(--status-crowded); }
  .badge.pending { background: var(--text-muted); }
  .card-line { font-size: .92rem; color: var(--text-muted); line-height: 1.55; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .card-btn {
    align-self: flex-start; margin-top: 6px; text-decoration: none; font-weight: 700; font-size: .85rem;
    padding: 9px 18px; border-radius: 999px; background: var(--surface); color: var(--accent); border: 2px solid var(--accent);
  }
  footer { margin-top: 22px; font-size: .78rem; color: var(--text-muted); line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="app-title">ルートチェンジ・カレンダー</p>
    <p class="app-sub" id="dataNote">読み込み中です…</p>
  </header>
  <div class="list" id="cardList"></div>
  <footer>
    NOBOROCK 浅草・大宮・池袋・高田馬場の4店舗のルートセット状況です。<br>情報はAIが定期的に公式サイトを確認して更新しています。
  </footer>
</div>

<script>
  var STORE_META = {
    asakusa: { name: '浅草店', url: 'https://noborock-climbing.com/program/%E6%B5%85%E8%8D%89%E5%BA%97/' },
    omiya: { name: '大宮店', url: 'https://noborock-climbing.com/program/omiya/' },
    ikebukuro: { name: '池袋店', url: 'https://noborock-climbing.com/program/ikebukuro/' },
    takadanobaba: { name: '高田馬場店', url: 'https://noborock-climbing.com/program/takadanobaba/' }
  };
  var STORE_ORDER = ['omiya', 'ikebukuro', 'asakusa', 'takadanobaba'];
  var WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
  function dateOnly(iso) { return new Date(iso + 'T00:00:00'); }
  function formatMDW(iso) {
    var d = dateOnly(iso), p = iso.split('-');
    return parseInt(p[1], 10) + '/' + parseInt(p[2], 10) + '（' + WEEKDAYS[d.getDay()] + '）';
  }
  function formatMDWFull(d) {
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WEEKDAYS[d.getDay()] + '）';
  }
  function formatStoredDateTimeW(str) {
    if (!str) return '';
    var sp = str.split(' ');
    return formatMDWFull(dateOnly(sp[0])) + (sp[1] || '');
  }
  function textEl(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    return el;
  }

  function render(docsById) {
    var today = new Date();
    var latestCheck = null;
    STORE_ORDER.forEach(function (id) {
      var data = docsById[id];
      if (data && data.lastChecked && (!latestCheck || data.lastChecked > latestCheck)) latestCheck = data.lastChecked;
    });
    document.getElementById('dataNote').textContent = '今日：' + formatMDWFull(today) +
      (latestCheck ? '／AIが最後に確認：' + formatStoredDateTimeW(latestCheck) : '／まだAIの確認前です');

    var list = document.getElementById('cardList');
    list.innerHTML = '';
    var todayD = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    STORE_ORDER.forEach(function (id) {
      var info = STORE_META[id], data = docsById[id];
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.store = id;
      var top = document.createElement('div');
      top.className = 'card-top';
      top.appendChild(textEl('span', 'store-name', info.name));
      var badgeEl = document.createElement('span');
      badgeEl.className = 'badge';
      top.appendChild(badgeEl);
      card.appendChild(top);

      var lines = [];
      if (!data || !data.prevRouteSet) {
        badgeEl.classList.add('pending');
        badgeEl.textContent = '確認待ち';
        lines.push('AIによる最初の確認をお待ちください');
      } else {
        var next = data.nextRouteSet;
        var hasNext = !!(next && next.startDate && next.endDate);
        // 次回予定の最終日を過ぎたら、AIの確認を待たず「実施済み」として扱う
        var nextDone = hasNext && dateOnly(next.endDate) < todayD;
        var nextActive = hasNext && !nextDone;
        var lastSet = data.prevRouteSet, lastSetFromPlan = false;
        if (nextDone && next.endDate > lastSet) { lastSet = next.endDate; lastSetFromPlan = true; }

        // ルートセット後1週間は混雑期間
        var sinceSet = Math.round(daysBetween(dateOnly(lastSet), todayD));
        var crowded = sinceSet >= 0 && sinceSet <= 7;
        var crowdEndD = new Date(dateOnly(lastSet).getTime());
        crowdEndD.setDate(crowdEndD.getDate() + 7);
        var crowdEndIso = crowdEndD.getFullYear() + '-' + ('0' + (crowdEndD.getMonth() + 1)).slice(-2) + '-' + ('0' + crowdEndD.getDate()).slice(-2);

        var duringSet = false, daysUntilStart = null;
        if (nextActive) {
          daysUntilStart = Math.round(daysBetween(todayD, dateOnly(next.startDate)));
          duringSet = daysUntilStart <= 0;
        }
        if (duringSet) { badgeEl.classList.add('closed'); badgeEl.textContent = 'ルートセット期間中'; }
        else if (crowded) { badgeEl.classList.add('crowded'); badgeEl.textContent = '混雑期間（〜' + formatMDW(crowdEndIso).replace(/（.）/, '') + '）'; }
        else if (nextActive && daysUntilStart > 0 && daysUntilStart <= 7) { badgeEl.classList.add('caution'); badgeEl.textContent = '次回まで1週間以内'; }
        else { badgeEl.classList.add('normal'); badgeEl.textContent = '通常'; }

        if (data.regularHours) lines.push('通常営業時間：平日 ' + data.regularHours.weekday + '／土日祝 ' + data.regularHours.weekend);
        lines.push('前回のルートセット：' + formatMDW(lastSet) + ' 実施' + (lastSetFromPlan ? '（予定日から自動表示）' : ''));
        if (crowded && !duringSet) lines.push('ルートセット後1週間は混みやすい時期です（' + formatMDW(crowdEndIso) + 'まで）');
        if (nextActive) {
          lines.push('次回のルートセット：' + formatMDW(next.startDate) + '〜' + formatMDW(next.endDate));
          var subParts = [];
          if (next.firstDayNote) subParts.push('初日 ' + next.firstDayNote);
          if (next.lastDayNote) subParts.push('最終日 ' + next.lastDayNote);
          if (subParts.length) lines.push('　' + subParts.join('／'));
        } else {
          lines.push('次回のルートセット：未確認');
        }
        if (data.notice && data.notice.date && data.notice.label) lines.push(formatMDW(data.notice.date) + '　' + data.notice.label);
      }
      lines.forEach(function (line) { card.appendChild(textEl('div', 'card-line', line)); });
      list.appendChild(card);
    });
  }

  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { render(d.stores || {}); })
    .catch(function () {
      document.getElementById('dataNote').textContent = 'データを読み込めませんでした。通信状態を確かめて、開き直してください。';
      render({});
    });
</script>
</body>
</html>
