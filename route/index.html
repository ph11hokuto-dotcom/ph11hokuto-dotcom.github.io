<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ルートチェンジ">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ルートチェンジ・カレンダー</title>
<style>
  :root {
    --bg-a: #fff2d6; --bg-b: #ffe1ec; --bg-c: #dcefff;
    --surface: #fffaf3; --text: #3a2b3f; --text-muted: #8d7387; --accent: #ff5b8c;
    --status-normal: #2fae63; --status-caution: #ef8c2c; --status-closed: #ef4f63; --status-crowded: #8a5fd6;
    --card-asakusa: #ffe9c7; --card-omiya: #dff5e3; --card-ikebukuro: #ffdce6; --card-takadanobaba: #dcecff; --card-shinjuku: #ebe2ff;
    --shadow: 0 10px 30px rgba(180, 90, 120, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-a: #241832; --bg-b: #2b1830; --bg-c: #16212f;
      --surface: #1c1420; --text: #f3ecf7; --text-muted: #b6a3c2; --accent: #ff8fb2;
      --status-normal: #4bcf8f; --status-caution: #ffab5c; --status-closed: #ff8a97; --status-crowded: #b79bf0;
      --card-asakusa: #3a2c1c; --card-omiya: #1d3324; --card-ikebukuro: #3a1f2a; --card-takadanobaba: #1a2b40; --card-shinjuku: #2c2242;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }
  }
  * { box-sizing: border-box; }
  /* 画面を引っぱったときにページが上下に動く（バウンドする）のを止める。
     中身が収まらない小さい画面では body の中だけスクロールできる */
  html { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; overscroll-behavior: none; }
  body {
    margin: 0;
    background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    /* 中身を上下のまん中に置く（収まらないときは上から並ぶ） */
    display: flex; flex-direction: column;
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 460px; margin: auto; }
  header { margin-bottom: 12px; }
  .app-title { font-weight: 800; font-size: 1.6rem; margin: 0 0 4px; }
  .app-sub { font-size: .85rem; color: var(--text-muted); line-height: 1.6; margin: 0; font-variant-numeric: tabular-nums; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { border-radius: 22px; padding: 13px 18px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; }
  .card[data-store="asakusa"] { background: var(--card-asakusa); }
  .card[data-store="omiya"] { background: var(--card-omiya); }
  .card[data-store="ikebukuro"] { background: var(--card-ikebukuro); }
  .card[data-store="takadanobaba"] { background: var(--card-takadanobaba); }
  .card[data-store="shinjuku"] { background: var(--card-shinjuku); }
  /* 全店共通の営業時間・ルートセットの時間（店ごとのカードには違うところだけ出す） */
  .common { font-size: .8rem; color: var(--text-muted); line-height: 1.5; margin: 6px 0 0; padding: 6px 12px; border-radius: 14px; background: var(--surface); opacity: .9; font-variant-numeric: tabular-nums; }
  .card-line.diff { color: var(--text); font-weight: 600; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .store-name { font-weight: 700; font-size: 1.2rem; }
  .badge { font-size: .78rem; font-weight: 700; padding: 5px 13px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .badge.normal  { background: var(--status-normal); }
  .badge.caution { background: var(--status-caution); }
  .badge.closed  { background: var(--status-closed); }
  .badge.crowded { background: var(--status-crowded); }
  .badge.pending { background: var(--text-muted); }
  .card-line { font-size: .92rem; color: var(--text-muted); line-height: 1.55; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .card-btn {
    align-self: flex-start; margin-top: 6px; text-decoration: none; font-weight: 700; font-size: .85rem;
    padding: 9px 18px; border-radius: 999px; background: var(--surface); color: var(--accent); border: 2px solid var(--accent);
  }
  /* 画面に収まりきらないときだけ、余白とすき間をさらに詰める（文字の大きさは変えない） */
  body.compact { padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  body.compact header { margin-bottom: 8px; }
  body.compact .list { gap: 7px; }
  body.compact .card { padding: 9px 18px 8px; gap: 1px; }
  body.compact footer { margin-top: 6px; }
  body.compact .app-title { font-size: 1.4rem; margin-bottom: 2px; }
  body.compact .common { margin-top: 4px; padding: 4px 12px; }
  body.compact .badge { padding: 3px 11px; }
  /* ホーム画面のアプリで開いたときは、上下の余白を少し広めにとる（上のぼかしを避ける） */
  html.standalone body { padding-top: calc(28px + env(safe-area-inset-top)); padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
  html.standalone body.compact { padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  /* それでも収まらないときは、いちばん下の説明文（AI確認の補足）だけ隠す */
  body.tight footer { display: none; }
  footer { margin-top: 10px; font-size: .78rem; color: var(--text-muted); line-height: 1.7; text-align: center; }

  /* ===== 記録機能（2026-11-15 追加） ===== */
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  body.compact { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  html.standalone body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  html.standalone body.compact { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
  /* さらに収まらないときは「※前回は予定日から自動表示」の行を上の1行にまとめる */
  .auto-note { display: none; }
  body.tight2 .auto-note { display: inline; }
  body.tight2 .card-line.auto { display: none; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .name-wrap { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .name-wrap .store-name { white-space: nowrap; }
  .mine { display: inline-flex; align-items: center; gap: 4px; font-size: .8rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mine[hidden] { display: none; }
  .want { border: 2px solid #e6cbd8; background: var(--surface); color: var(--text-muted); font-size: .9rem; line-height: 1; width: 28px; height: 28px; padding: 0; border-radius: 999px; }
  .want.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 8px;
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); box-shadow: 0 -4px 16px rgba(180, 90, 120, .12); }
  .tabs button { flex: 1; max-width: 220px; border: 0; background: transparent; color: var(--text-muted); font-weight: 700; font-size: .95rem; padding: 8px 0; border-radius: 14px; }
  .tabs button.on { background: var(--accent); color: #fff; }
  .view[hidden] { display: none; }
  .rec-title { font-weight: 800; font-size: 1.6rem; margin: 0 0 10px; }
  .rec-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn-main { flex: 1; border: 0; background: var(--accent); color: #fff; font-weight: 800; font-size: 1.05rem; padding: 14px; border-radius: 16px; box-shadow: 0 8px 20px rgba(255, 91, 140, .35); }
  .btn-sub { border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; font-size: .85rem; padding: 10px 12px; border-radius: 16px; }
  .rec-msg { font-size: .9rem; color: var(--text-muted); line-height: 1.7; background: var(--surface); border-radius: 18px; padding: 14px 16px; }
  .group { background: var(--surface); border-radius: 18px; padding: 10px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .gh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 8px; font-weight: 700; margin: 2px 2px 4px; }
  .gh span { white-space: nowrap; }
  .gh small { font-weight: 600; font-size: .8rem; color: var(--text-muted); white-space: nowrap; }
  .gvisits { font-size: .8rem; color: var(--text-muted); margin: 0 2px 8px; line-height: 1.8; font-variant-numeric: tabular-nums; }
  .vchip { display: inline-block; white-space: nowrap; margin-right: 6px; }
  .vchip button { border: 0; background: #eee3ea; color: var(--text-muted); border-radius: 999px; font-size: .72rem; padding: 0 7px; margin-left: 2px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #eadfe6; border: 0; padding: 0; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .tag { position: absolute; left: 4px; bottom: 4px; font-size: .74rem; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: rgba(255, 255, 255, .92); color: #3a2b3f; }
  .ph .ok { position: absolute; right: 4px; top: 4px; font-size: .7rem; font-weight: 800; padding: 2px 6px; border-radius: 8px; background: var(--status-normal); color: #fff; }
  .ph .ok.ng { background: var(--text-muted); }
  .more { display: block; margin: 4px auto 0; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 8px; }
  /* 追加・編集の画面（下からかぶせる） */
  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(58, 43, 63, .45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-bg[hidden] { display: none; }
  .sheet { width: 100%; max-width: 460px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain; background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 60%, var(--bg-c) 100%);
    border-radius: 24px 24px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .sheet-head b { font-size: 1.2rem; }
  .x { border: 0; background: var(--surface); border-radius: 999px; width: 36px; height: 36px; font-size: 1.1rem; color: var(--text-muted); }
  .preview { width: 100%; max-height: 30vh; object-fit: contain; border-radius: 16px; background: #eadfe6; display: block; margin-bottom: 10px; }
  .preview.loading { min-height: 160px; }
  .rot { display: flex; gap: 8px; margin: -2px 0 10px; }
  .rot[hidden] { display: none; }
  .rot button { flex: 1; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; font-size: .9rem; padding: 8px 6px; border-radius: 12px; }
  .rot button:disabled { opacity: .45; }
  .box { background: var(--surface); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); }
  .box h4 { margin: 0 0 6px; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
  .box h4 input { font: inherit; font-size: .9rem; border: 2px solid #f0d3df; border-radius: 10px; padding: 3px 8px; background: #fff; color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { border: 0; background: var(--bg-b); font-size: .8rem; font-weight: 700; padding: 8px 0; width: calc((100% - 36px) / 7); text-align: center; border-radius: 10px; white-space: nowrap; }
  .chips.store .chip { width: auto; flex: 1 1 auto; padding: 8px 6px; }
  .chip.sel { background: var(--accent); color: #fff; }
  .two { display: flex; gap: 8px; }
  .two button { flex: 1; border: 0; font-weight: 800; font-size: 1rem; padding: 13px 6px; border-radius: 12px; }
  .b-sent { background: var(--status-normal); color: #fff; }
  .b-unsent { background: #eee3ea; color: var(--text-muted); }
  .b-save { background: var(--accent); color: #fff; }
  .b-del { background: transparent !important; color: var(--status-closed) !important; border: 2px solid var(--status-closed) !important; }
  .hint { font-size: .78rem; color: var(--text-muted); margin: 8px 2px 0; line-height: 1.6; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: #3a2b3f; color: #fff;
    font-size: .88rem; font-weight: 700; padding: 10px 18px; border-radius: 999px; box-shadow: var(--shadow); white-space: nowrap; }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="wrap view" id="routeView">
  <header>
    <p class="app-title">ルートチェンジ・カレンダー</p>
    <p class="app-sub"><span id="dataNote">読み込み中です…</span><span class="auto-note">／※は予定日から</span></p>
    <p class="common">共通 営業 平日10:00〜23:00／土日祝〜21:00<br>セット 初日17:00 close／最終日18:30 open</p>
  </header>
  <div class="list" id="cardList"></div>
  <footer>
    NOBOROCK 5店舗・共通と違うところは太字・AIが毎週確認<br>☆＝次のルートセットまでに行きたい店・n回＝今期に行った回数
  </footer>
</div>

<!-- 記録の画面 -->
<div class="wrap view" id="recView" hidden style="margin-top:0">
  <p class="rec-title">記録</p>
  <div class="rec-actions" id="recActions" hidden>
    <button class="btn-main" id="addPhotoBtn">＋ 写真を追加</button>
    <button class="btn-sub" id="addVisitBtn">今日行った<br>（写真なし）</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <div id="recList"><p class="rec-msg">読み込み中です…</p></div>
</div>

<div class="tabs">
  <button class="on" data-view="routeView">ルートセット</button>
  <button data-view="recView">記録</button>
</div>

<!-- 追加・編集の画面 -->
<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><b id="sheetTitle">写真を追加</b><button class="x" id="sheetClose" aria-label="閉じる">✕</button></div>
    <img class="preview" id="sheetImg" alt="">
    <div class="rot" id="rotBar" hidden><button id="rotL" aria-label="左に90度回す">⟲ 左に90°</button><button id="rotR" aria-label="右に90度回す">右に90° ⟳</button></div>
    <div class="box">
      <h4>日付 <input type="date" id="sheetDate"></h4>
      <h4>店</h4>
      <div class="chips store" id="storeChips"></div>
      <div id="gradeArea">
        <h4>全部登れたグレード</h4>
        <div class="chips" id="gradeChips"></div>
      </div>
      <div class="two" id="sheetBtns"></div>
      <p class="hint" id="sheetHint"></p>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
  var STORE_META = {
    asakusa: { name: '浅草店', url: 'https://noborock-climbing.com/program/%E6%B5%85%E8%8D%89%E5%BA%97/' },
    omiya: { name: '大宮店', url: 'https://noborock-climbing.com/program/omiya/' },
    ikebukuro: { name: '池袋店', url: 'https://noborock-climbing.com/program/ikebukuro/' },
    takadanobaba: { name: '高田馬場店', url: 'https://noborock-climbing.com/program/takadanobaba/' },
    shinjuku: { name: '新宿店', url: 'https://noborock-climbing.com/program/%e6%96%b0%e5%ae%bf%e5%ba%97/' }
  };
  var STORE_ORDER = ['omiya', 'ikebukuro', 'asakusa', 'takadanobaba', 'shinjuku'];
  // 上の「全店共通」の欄と同じ値。これと違う店だけ、カードに表示する
  var STD = { weekday: '10:00〜23:00', weekend: '10:00〜21:00', firstDayNote: '17:00〜 close', lastDayNote: '18:30〜 open' };
  function sameNote(a, b) { return (a || '').replace(/\s+/g, '') === b.replace(/\s+/g, ''); }
  var WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  function daysBetween(a, b) { return Math.floor((b - a) / 86400000); }
  function dateOnly(iso) { return new Date(iso + 'T00:00:00'); }
  function formatMDW(iso) {
    var d = dateOnly(iso), p = iso.split('-');
    return parseInt(p[1], 10) + '/' + parseInt(p[2], 10) + '(' + WEEKDAYS[d.getDay()] + ')';
  }
  function formatStoredDateTime(str) {
    if (!str) return '';
    var sp = str.split(' '), p = sp[0].split('-');
    return parseInt(p[1], 10) + '/' + parseInt(p[2], 10) + ' ' + (sp[1] || '').replace(/^0/, '');
  }
  function formatMD(iso) { var p = iso.split('-'); return parseInt(p[1], 10) + '/' + parseInt(p[2], 10); }
  function isoOf(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function textEl(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    el.textContent = text;
    return el;
  }

  var CUR = {};   // 店ごとの「今の期間の始まり」（前回のルートセット日）
  var KNOWN = {}; // 店ごとに分かっているルートセット日
  function render(docsById) {
    var today = new Date();
    var latestCheck = null;
    STORE_ORDER.forEach(function (id) {
      var data = docsById[id];
      if (data && data.lastChecked && (!latestCheck || data.lastChecked > latestCheck)) latestCheck = data.lastChecked;
    });
    document.getElementById('dataNote').textContent = '今日 ' + formatMDW(isoOf(today)) +
      (latestCheck ? '／AI確認 ' + formatStoredDateTime(latestCheck) : '／AI確認前');

    var list = document.getElementById('cardList');
    list.innerHTML = '';
    var todayD = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    STORE_ORDER.forEach(function (id) {
      var info = STORE_META[id], data = docsById[id];
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.store = id;
      var top = document.createElement('div');
      top.className = 'card-top';
      var nameWrap = document.createElement('span');
      nameWrap.className = 'name-wrap';
      nameWrap.appendChild(textEl('span', 'store-name', info.name));
      // 自分の記録（☆＝行きたい、n回＝今期に行った回数）
      var mine = document.createElement('span');
      mine.className = 'mine';
      mine.dataset.store = id;
      mine.hidden = true;
      nameWrap.appendChild(mine);
      top.appendChild(nameWrap);
      var badgeEl = document.createElement('span');
      badgeEl.className = 'badge';
      top.appendChild(badgeEl);
      card.appendChild(top);

      var lines = [];
      if (!data || !data.prevRouteSet) {
        badgeEl.classList.add('pending');
        badgeEl.textContent = '確認待ち';
        lines.push('AIの最初の確認待ちです');
      } else {
        var next = data.nextRouteSet;
        var hasNext = !!(next && next.startDate && next.endDate);
        // 次回予定の最終日を過ぎたら、AIの確認を待たず「実施済み」として扱う
        var nextDone = hasNext && dateOnly(next.endDate) < todayD;
        var nextActive = hasNext && !nextDone;
        var lastSet = data.prevRouteSet, lastSetFromPlan = false;
        if (nextDone && next.endDate > lastSet) { lastSet = next.endDate; lastSetFromPlan = true; }
        CUR[id] = lastSet;
        KNOWN[id] = [data.prevRouteSet];
        if (nextDone) KNOWN[id].push(next.endDate);

        // ルートセット後1週間は混雑期間
        var sinceSet = Math.round(daysBetween(dateOnly(lastSet), todayD));
        var crowded = sinceSet >= 0 && sinceSet <= 7;
        var crowdEndD = new Date(dateOnly(lastSet).getTime());
        crowdEndD.setDate(crowdEndD.getDate() + 7);
        var crowdEndIso = crowdEndD.getFullYear() + '-' + ('0' + (crowdEndD.getMonth() + 1)).slice(-2) + '-' + ('0' + crowdEndD.getDate()).slice(-2);

        var duringSet = false, daysUntilStart = null;
        if (nextActive) {
          daysUntilStart = Math.round(daysBetween(todayD, dateOnly(next.startDate)));
          duringSet = daysUntilStart <= 0;
        }
        if (duringSet) { badgeEl.classList.add('closed'); badgeEl.textContent = 'ルートセット期間中'; }
        else if (crowded) { badgeEl.classList.add('crowded'); badgeEl.textContent = '混雑期間（〜' + formatMD(crowdEndIso) + '）'; }
        else if (nextActive && daysUntilStart > 0 && daysUntilStart <= 7) { badgeEl.classList.add('caution'); badgeEl.textContent = '次回まで1週間以内'; }
        else { badgeEl.classList.add('normal'); badgeEl.textContent = '通常'; }

        // 1画面に収めるため、前回と次回は1行にまとめる
        lines.push('前回 ' + formatMDW(lastSet) + (lastSetFromPlan ? '※' : '') + '／次回 ' +
          (nextActive ? formatMDW(next.startDate) + '〜' + formatMDW(next.endDate) : '未確認'));
        if (lastSetFromPlan) lines.push({ text: '※前回は予定日から自動表示', auto: true });

  // 写真を縮めてJPEGにする（maxは長い辺、squareなら真ん中を正方形に切る）
  function shrink(img, max, square, q) {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height, sx = 0, sy = 0, sw = w, sh = h;
    if (square) { var s = Math.min(w, h); sx = (w - s) / 2; sy = (h - s) / 2; sw = sh = s; }

  // ---- 写真を左右に90度回す（2026-11-24 追加） ----

        c.width = h; c.height = w;

        out.onerror = ng;

    closeSheet();
    DB.visits = DB.visits.filter(function (v) { return !(v.date === date && v.store === store); });
    DB.visits.push({ date: date, store: store }); saveDbCache(); renderMine(); renderRec();
    api(null, { a: 'visit', date: date, store: store }).then(function () { toast('行った日を保存しました'); })
      .catch(function () { toast('保存できませんでした。通信を確かめてください', 4000); });
  }
  function removeVisit(store, date) {
    DB.visits = DB.visits.filter(function (v) { return !(v.date === date && v.store === store); });
    saveDbCache(); renderMine(); renderRec();
    api(null, { a: 'unvisit', date: date, store: store }).catch(function () { toast('消せませんでした。通信を確かめてください', 4000); });
  }
  function saveEdit() {
    var p = sheet.item, date = $('sheetDate').value || p.date;
    var upd = { date: date, store: sheet.store, grade: sheet.grade, sent: sheet.sent, period: periodOf(sheet.store, date) };
    if (sheet.rotated) return saveRotated(p, upd);
    closeSheet();
    toast('保存中…', 0);
    api(null, Object.assign({ a: 'update', id: p.id }, upd)).then(function () {
      Object.assign(p, upd); saveDbCache(); renderMine(); renderRec(); toast('直しました');
    }).catch(function () { toast('保存できませんでした。通信を確かめてください', 4000); });
  }
  function saveDelete() {
    var p = sheet.item;
    closeSheet();
    toast('消しています…', 0);
    api(null, { a: 'delete', id: p.id }).then(function () {
      DB.problems = DB.problems.filter(function (x) { return x.id !== p.id; });
      try { localStorage.removeItem(LS_TH + p.id); } catch (e) {}
      saveDbCache(); renderMine(); renderRec(); toast('消しました');
    }).catch(function () { toast('消せませんでした。通信を確かめてください', 4000); });
  }

  // ---- タブの切り替え ----
  var tabBtns = document.querySelectorAll('.tabs button');
  for (var ti = 0; ti < tabBtns.length; ti++) tabBtns[ti].addEventListener('click', function () {
    var v = this.dataset.view;
    for (var j = 0; j < tabBtns.length; j++) tabBtns[j].classList.toggle('on', tabBtns[j] === this);
    $('routeView').hidden = v !== 'routeView';
    $('recView').hidden = v !== 'recView';
    document.body.scrollTop = 0;
    if (v === 'routeView') fitToScreen(); else { document.body.classList.remove('compact', 'tight', 'tight2'); renderRec(); }
  });

  fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { render(d.stores || {}); fitToScreen(); renderMine(); refreshDb(); })
    .catch(function () {
      document.getElementById('dataNote').textContent = 'データを読み込めませんでした。通信状態を確かめて、開き直してください。';
      render({});
      fitToScreen();
      refreshDb();
    });
</script>
</body>
</html>
