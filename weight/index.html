<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="体重記録">
<meta name="theme-color" content="#EEF3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11181D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<title>ふたりの体重記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 1カラムのスマホアプリ型: 入力カード → グラフ → 履歴 */
:root {
  --bg: #EEF3F6;
  --surface: #FFFFFF;
  --fg: #1D2A33;
  --muted: #61717C;
  --line: #D5DFE6;
  --ori: #D9577A;
  --ori-soft: #FBE7ED;
  --poko: #2C6BD6;
  --poko-soft: #E3EDFB;
  --danger: #B3322E;
  --ok: #2E7D4F;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181D; --surface: #1A242B; --fg: #E6EDF2; --muted: #9AAAB5; --line: #2E3C46;
    --ori: #F07D9C; --ori-soft: #3A2129; --poko: #6FA0F2; --poko-soft: #1C2B42;
    --danger: #F08A84; --ok: #7CCB9A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181D; --surface: #1A242B; --fg: #E6EDF2; --muted: #9AAAB5; --line: #2E3C46;
  --ori: #F07D9C; --ori-soft: #3A2129; --poko: #6FA0F2; --poko-soft: #1C2B42;
  --danger: #F08A84; --ok: #7CCB9A; color-scheme: dark;
}
* { box-sizing: border-box; }
/* 1画面に収める: ページは固定し、グラフが残りの高さを使う。履歴は下から出す一覧の中だけスクロール */
html { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); -webkit-text-size-adjust: 100%; }
body { position: fixed; inset: 0; margin: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: none; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 640px; height: 100%; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
/* ホーム画面アプリで開いたとき、タイトルが時計・電池の表示に重ならないよう少し下げる */
html.standalone .wrap { padding-top: max(calc(env(safe-area-inset-top) + 4px), 24px); }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
header h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin: 0; letter-spacing: .02em; white-space: nowrap; }
.btn-hist { flex: none; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 8px; }
.card.grow { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.notice { font-size: .85rem; padding: 10px 12px; border-radius: 10px; background: var(--poko-soft); color: var(--fg); }
.notice.err { background: var(--ori-soft); }

/* 入力 */
.who { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.who input { position: absolute; opacity: 0; pointer-events: none; }
.who label { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px; border-radius: 10px; border: 2px solid var(--line); font-family: var(--font-display); font-weight: 700; cursor: pointer; }
.who label .dot { width: 10px; height: 10px; border-radius: 50%; }
.who input:checked + label.ori { border-color: var(--ori); background: var(--ori-soft); }
.who input:checked + label.poko { border-color: var(--poko); background: var(--poko-soft); }
.who input:focus-visible + label { outline: 2px solid var(--fg); outline-offset: 2px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
/* 「日付」「体重」の見出しは、見ればわかるので画面には出さない（読み上げ用に残す） */
.field > span:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field span { font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
.field input { font: inherit; font-size: 1.05rem; padding: 8px 10px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.field input:focus-visible { outline: 2px solid var(--poko); outline-offset: 1px; }
.unit { position: relative; }
.unit::after { content: "kg"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.unit input { padding-right: 36px; }
.actions { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
button { font: inherit; cursor: pointer; border-radius: 10px; }
.btn-main { flex: 1 1 auto; padding: 10px; border: none; background: var(--fg); color: var(--surface); font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.btn-main:disabled { opacity: .45; cursor: default; }
.btn-del { flex: none; padding: 8px 14px; white-space: nowrap; border: 1px solid var(--line); background: transparent; color: var(--danger); font-size: .9rem; }
.btn-del.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
button:focus-visible { outline: 2px solid var(--poko); outline-offset: 2px; }
/* 保存したときのお知らせは、画面の下に少しだけ出して消す（場所を取らないように） */
.status { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; width: max-content; max-width: calc(100% - 32px); padding: 8px 14px; border-radius: 999px; background: var(--fg); color: var(--surface); font-size: .82rem; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.status.show { opacity: 1; }
.status.ok { background: var(--ok); color: #fff; }
.status.err { background: var(--danger); color: #fff; }

/* グラフ */
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.chart-head h2 { margin: 0; }
.range { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 9px; }
.range button { border: none; background: transparent; color: var(--muted); padding: 4px 10px; font-size: .8rem; border-radius: 7px; }
.range button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.stat { border-radius: 10px; padding: 7px 10px; min-width: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.stat.ori.on { box-shadow: inset 0 0 0 2px var(--ori); }
.stat.poko.on { box-shadow: inset 0 0 0 2px var(--poko); }
.stat:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.stat.ori { background: var(--ori-soft); }
.stat.poko { background: var(--poko-soft); }
.stat .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.stat .nm { font-size: .85rem; line-height: 1.3; font-family: var(--font-display); font-weight: 700; }
.goal-btn { padding: 2px 8px; border: 1px solid currentColor; background: var(--surface); font-size: .72rem; font-weight: 700; border-radius: 999px; }
.stat.ori .goal-btn { color: var(--ori); }
.stat.poko .goal-btn { color: var(--poko); }
.stat.ori .nm { color: var(--ori); }
.stat.poko .nm { color: var(--poko); }
.stat .v { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.2; }
.stat .v small { font-size: .85rem; font-weight: 400; color: var(--muted); }
.stat .bmi { font-weight: 700; }
.stat.ori .bmi { color: var(--ori); }
.stat.poko .bmi { color: var(--poko); }
.stat .d { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
.stat .g { margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); font-size: .74rem; line-height: 1.35; font-variant-numeric: tabular-nums; color: var(--muted); }
.stat .g span, .stat .d span { white-space: nowrap; } /* 意味の切れ目でだけ折り返す */
.stat .g b { font-size: .95rem; color: var(--fg); }
.stat .g.done b { color: var(--ok); }
#chart { width: 100%; flex: 1 1 auto; min-height: 120px; position: relative; }
#chart svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#chart .pt { cursor: pointer; -webkit-tap-highlight-color: transparent; }
#chart .pt:hover .mark, #chart .pt:focus-visible .mark { stroke-width: 3.5; }
#chart .pt:focus { outline: none; }
#chart text { font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: .9rem; text-align: center; padding: 40px 8px; }

/* 履歴（下から出す一覧） */
dialog.sheet { border: none; padding: 0; margin: auto auto 0; width: 100%; max-width: 640px; max-height: calc(100% - 48px - env(safe-area-inset-top)); border-radius: 16px 16px 0 0; background: var(--surface); color: var(--fg); }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .35); }
dialog.sheet[open] { display: flex; flex-direction: column; }
/* 目標の画面はキーボードに隠れないよう、画面のまん中に出す */
dialog#goal { margin: auto; width: calc(100% - 32px); max-width: 420px; border-radius: 16px; }
.goal-body { padding: 12px 16px 16px; }
.goal-body .who-name { font-family: var(--font-display); font-weight: 700; margin: 0 0 8px; }
#goal .field > span:first-child { position: static; width: auto; height: auto; overflow: visible; clip: auto; font-size: .78rem; color: var(--muted); }
#goal .fields { grid-template-columns: 1fr; }
.goal-body .gst { font-size: .8rem; min-height: 1.3em; margin: 6px 0 0; color: var(--danger); }
.hist-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
.hist-head h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; }
.btn-close { padding: 6px 14px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: .9rem; }
.hist-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: .78rem; color: var(--muted); font-weight: 400; }
th.ori { color: var(--ori); font-weight: 700; }
th.poko { color: var(--poko); font-weight: 700; }
tbody tr { cursor: pointer; }
tbody tr:hover td, tbody tr.sel td { background: var(--bg); }
td.none { color: var(--line); }
td .b { display: block; font-size: .72rem; line-height: 1.2; color: var(--muted); }
.hint { font-size: .78rem; color: var(--muted); margin: 8px 0 0; }
.more { margin-top: 10px; width: 100%; padding: 9px; border: 1px solid var(--line); background: transparent; color: var(--fg); }
@media (prefers-reduced-motion: no-preference) { .btn-main, .who label { transition: background .15s, border-color .15s; } }
/* 1画面に入りきらない低い画面（古い小さいiPhoneなど）だけ、重ならずに下へスクロールする */
@media (max-height: 540px) {
  .wrap { height: auto; }
  .card.grow { flex: none; }
  #chart { flex: none; height: 200px; }
}
</style>
<script>if (window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)) document.documentElement.classList.add("standalone");</script>
</head>
<body>

<div class="wrap">
  <header>
    <h1>ふたりの体重記録</h1>
    <button type="button" class="btn-hist" id="open-hist">履歴</button>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section class="card grow" aria-labelledby="h-chart">
    <div class="chart-head">
      <h2 id="h-chart">推移</h2>
      <div class="range" id="range">
        <button type="button" data-days="30" aria-pressed="false">1か月</button>
        <button type="button" data-days="90" aria-pressed="true">3か月</button>
        <button type="button" data-days="365" aria-pressed="false">1年</button>
        <button type="button" data-days="0" aria-pressed="false">全部</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="chart"><div class="empty">読み込み中…</div></div>
  </section>

  <section class="card" aria-label="記録する">
    <form id="form" novalidate>
      <div class="who" role="radiogroup" aria-label="誰の記録か">
        <input type="radio" name="who" id="who-orishi" value="orishi">
        <label for="who-orishi" class="ori"><span class="dot" style="background:var(--ori)"></span>オリシ</label>
        <input type="radio" name="who" id="who-pokoshi" value="pokoshi">
        <label for="who-pokoshi" class="poko"><span class="dot" style="background:var(--poko)"></span>ぽこし</label>
      </div>
      <div class="fields">
        <label class="field"><span>日付</span><input type="date" id="date" required></label>
        <label class="field"><span>体重</span><span class="unit"><input type="number" id="weight" inputmode="decimal" step="0.1" min="20" max="200" placeholder="00.0"></span></label>
      </div>
      <div class="actions">
        <button type="submit" class="btn-main" id="save">記録する</button>
        <button type="button" class="btn-del" id="del" hidden>消す</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </form>
  </section>
</div>

<dialog id="hist" class="sheet" aria-labelledby="h-list">
  <div class="hist-head">
    <h2 id="h-list">履歴</h2>
    <button type="button" class="btn-close" id="close-hist">閉じる</button>
  </div>
  <div class="hist-body">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>日付</th><th class="ori">オリシ</th><th class="poko">ぽこし</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="hint">体重の下の小さい数字がBMIです。行をタップすると、その日の記録を直せます。グラフの点をタップしても直せます。</p>
    <button type="button" class="more" id="more" hidden>もっと見る</button>
  </div>
</dialog>

<dialog id="goal" class="sheet" aria-labelledby="h-goal">
  <div class="hist-head">
    <h2 id="h-goal">目標</h2>
    <button type="button" class="btn-close" id="close-goal">閉じる</button>
  </div>
  <form class="goal-body" id="goal-form" novalidate>
    <p class="who-name" id="goal-name"></p>
    <div class="fields">
      <label class="field"><span>目標の体重</span><span class="unit"><input type="number" id="goal-w" inputmode="decimal" step="0.1" min="20" max="200" placeholder="00.0"></span></label>
      <label class="field"><span>いつまでに</span><input type="date" id="goal-d"></label>
    </div>
    <div class="actions">
      <button type="submit" class="btn-main" id="goal-save">目標を保存</button>
      <button type="button" class="btn-del" id="goal-del" hidden>目標を消す</button>
    </div>
    <p class="gst" id="goal-st" aria-live="polite"></p>
  </form>
</dialog>

<script>
(function () {
  const PEOPLE = [
    { key: "orishi", name: "オリシ", color: "var(--ori)" },
    { key: "pokoshi", name: "ぽこし", color: "var(--poko)" }
  ];
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const $ = (id) => document.getElementById(id);
  const rows = new Map(); // date -> {orishi, pokoshi}
  let cfg = null, ready = false, loaded = false, busy = false;
  let goals = {}; // who -> {weight, date}（スプレッドシートの「目標」シート）
  const heights = { orishi: 148, pokoshi: 159 }; // 身長(cm)で固定。BMIの計算に使う
  let rangeDays = 90, listLimit = 30, delTimer = null;

  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const md = (s) => { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
  const label = (s) => { const d = parse(s); return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
  const fullLabel = (s) => { const d = parse(s); return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")"; };
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const fmt = (v) => v.toFixed(1);
  const bmi = (w, k) => { const h = num(heights[k]); return h ? w / ((h / 100) * (h / 100)) : null; };
  const nameOf = (k) => PEOPLE.find((p) => p.key === k).name;
  const colorOf = (k) => PEOPLE.find((p) => p.key === k).color;

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ---- 初期状態 ----
  $("date").value = iso(new Date());
  const lastWho = recall("who") || "pokoshi";
  ($("who-" + lastWho) || $("who-pokoshi")).checked = true;

  function who() { return document.querySelector('input[name="who"]:checked').value; }
  let stTimer = null;
  function setStatus(msg, cls) {
    const s = $("status"); clearTimeout(stTimer);
    s.textContent = msg; s.className = "status" + (cls ? " " + cls : "") + (msg ? " show" : "");
    if (msg && cls) stTimer = setTimeout(() => s.classList.remove("show"), cls === "err" ? 6000 : 3000);
  }
  function notice(msg, err) { const n = $("notice"); n.textContent = msg; n.className = "notice" + (err ? " err" : ""); n.hidden = !msg; }

  // フォームを今の人・日付の記録に合わせる
  function syncForm(keepWeight) {
    const r = rows.get($("date").value);
    const v = r ? num(r[who()]) : null;
    if (!keepWeight) $("weight").value = v != null ? fmt(v) : "";
    $("save").textContent = v != null ? "上書き保存" : "記録する";
    $("del").hidden = v == null || !ready;
    disarmDel();
    $("save").disabled = !ready || busy;
    document.querySelectorAll("#rows tr").forEach((tr) => tr.classList.toggle("sel", tr.dataset.date === $("date").value));
  }

  // 人を選ぶ（記録する人・グラフ右端のBMI目盛りの両方が切り替わる）
  function selectWho(k) {
    $("who-" + k).checked = true;
    store("who", k); syncForm(); setStatus(""); renderChart();
  }
  document.querySelectorAll('input[name="who"]').forEach((el) => el.addEventListener("change", () => selectWho(who())));
  $("stats").addEventListener("click", (e) => {
    const gb = e.target.closest(".goal-btn"); if (gb) { openGoal(gb.dataset.goal); return; }
    const t = e.target.closest(".stat[data-who]"); if (t) selectWho(t.dataset.who);
  });

  // ---- 目標の画面 ----
  let goalWho = null;
  function openGoal(k) {
    goalWho = k;
    const g = goals[k];
    $("goal-name").textContent = nameOf(k) + "の目標";
    $("goal-name").style.color = colorOf(k);
    $("goal-w").value = g && num(g.weight) != null ? fmt(g.weight) : "";
    if (g && g.date) $("goal-d").value = g.date;
    else { const d = new Date(); d.setMonth(d.getMonth() + 3); $("goal-d").value = iso(d); } // 期限の最初の案は3か月後
    $("goal-del").hidden = !g; $("goal-st").textContent = "";
    $("goal-save").disabled = !ready;
    $("goal").showModal();
  }
  $("close-goal").addEventListener("click", () => $("goal").close());
  $("goal").addEventListener("click", (e) => { if (e.target === $("goal")) $("goal").close(); });
  async function saveGoal(w, d) {
    if (!ready || busy) return;
    busy = true; $("goal-save").disabled = true; $("goal-st").textContent = "";
    try {
      const res = await call({ action: "goal", who: goalWho, weight: w, date: d });
      if (!res.goals) throw Object.assign(new Error("old"), { code: "old_script" });
      apply(res);
      $("goal").close();
      setStatus(nameOf(goalWho) + (w == null ? "の目標を消しました。" : "の目標を " + label(d) + "までに " + fmt(w) + "kg にしました。"), "ok");
    } catch (err) {
      $("goal-st").textContent = err && (err.code === "old_script" || err.code === "bad_request")
        ? "目標を保存できませんでした。保存先（Apps Script）の更新がまだのようです。ぽこしに伝えてください。"
        : "保存できませんでした。通信状態を確かめて、もう一度押してください。";
    } finally { busy = false; $("goal-save").disabled = !ready; }
  }
  $("goal-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const w = Math.round(parseFloat($("goal-w").value) * 10) / 10, d = $("goal-d").value;
    if (!isFinite(w) || w < 20 || w > 200) { $("goal-st").textContent = "目標の体重は20〜200kgの数字で入れてください（例: 54.0）。"; return; }
    if (!d) { $("goal-st").textContent = "いつまでに、の日付を入れてください。"; return; }
    saveGoal(w, d);
  });
  $("goal-del").addEventListener("click", () => saveGoal(null, null));
  $("stats").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest(".stat[data-who]"); if (!t) return;
    e.preventDefault(); selectWho(t.dataset.who);
  });
  $("date").addEventListener("change", () => { syncForm(); setStatus(""); });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!ready || busy) return;
    const date = $("date").value;
    const w = Math.round(parseFloat($("weight").value) * 10) / 10;
    if (!date) { setStatus("日付を入れてください。", "err"); return; }
    if (!isFinite(w) || w < 20 || w > 200) { setStatus("体重は20〜200kgの数字で入れてください（例: 58.4）。", "err"); return; }
    const k = who();
    busy = true; $("save").disabled = true; setStatus("保存しています…");
    try {
      apply(await call({ action: "set", date: date, who: k, weight: w }));
      setStatus(nameOf(k) + "の " + label(date) + " を " + fmt(w) + "kg で保存しました。", "ok");
    } catch (err) {
      handleWriteError(err);
    } finally {
      busy = false; syncForm(true);
    }
  });

  function disarmDel() { clearTimeout(delTimer); const b = $("del"); b.classList.remove("armed"); b.textContent = "消す"; }
  $("del").addEventListener("click", async () => {
    const b = $("del");
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "もう一度押す";
      delTimer = setTimeout(disarmDel, 4000);
      return;
    }
    disarmDel();
    const date = $("date").value, k = who(), r = rows.get(date);
    if (!r || !ready || busy) return;
    busy = true; setStatus("消しています…");
    try {
      apply(await call({ action: "set", date: date, who: k, weight: null }));
      $("weight").value = "";
      setStatus(nameOf(k) + "の " + label(date) + " の記録を消しました。", "ok");
    } catch (err) { handleWriteError(err); }
    finally { busy = false; syncForm(true); }
  });

  function handleWriteError(err) {
    if (err && err.code === "auth") {
      setStatus("保存できませんでした。設定リンクが古いようです。ぽこしから新しい設定リンクをもらって開き直してください。", "err");
    } else {
      setStatus("保存できませんでした。通信状態を確かめて、もう一度押してください。", "err");
    }
  }

  // ---- 範囲切り替え ----
  $("range").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    rangeDays = Number(b.dataset.days);
    store("range", String(rangeDays));
    $("range").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderChart();
  });
  const savedRange = recall("range");
  if (savedRange != null) {
    const b = $("range").querySelector('[data-days="' + savedRange + '"]');
    if (b) { rangeDays = Number(savedRange); $("range").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }
  }
  $("more").addEventListener("click", () => { listLimit += 60; renderList(); });

  // ---- 描画 ----
  function sortedDates() { return Array.from(rows.keys()).sort(); }

  function inRange() {
    const dates = sortedDates();
    if (!rangeDays) return dates;
    const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - rangeDays + 1);
    const f = iso(from);
    return dates.filter((d) => d >= f);
  }

  function renderStats(dates) {
    $("stats").innerHTML = PEOPLE.map((p) => {
      const pts = dates.map((d) => [d, num(rows.get(d)[p.key])]).filter((x) => x[1] != null);
      const cls = p.key === "orishi" ? "ori" : "poko", on = p.key === who();
      const open = '<div class="stat ' + cls + (on ? " on" : "") + '" data-who="' + p.key + '" tabindex="0" role="button" aria-pressed="' + on + '" aria-label="' + p.name + 'のBMIをグラフに出す">'
        + '<div class="top"><span class="nm">' + p.name + '</span><button type="button" class="goal-btn" data-goal="' + p.key + '">目標</button></div>';
      // 最新の体重は、期間に関係なくいちばん新しい記録を使う（目標までの残りもこれで計算する）
      const allPts = sortedDates().map((d) => [d, num(rows.get(d)[p.key])]).filter((x) => x[1] != null);
      const latest = allPts.length ? allPts[allPts.length - 1] : null;
      const gl = goalLine(p.key, latest ? latest[1] : null);
      if (!latest) return open + '<div class="v">—</div><div class="d">まだ記録がありません</div>' + gl + "</div>";
      let ds = "この期間の記録なし";
      if (pts.length > 1) { const diff = pts[pts.length - 1][1] - pts[0][1]; ds = (diff > 0 ? "+" : diff < 0 ? "−" : "±") + Math.abs(diff).toFixed(1) + "kg"; }
      else if (pts.length === 1) ds = "記録1件";
      const b = bmi(latest[1], p.key);
      return open + '<div class="v">' + fmt(latest[1]) + '<small> kg</small></div><div class="d">' + (b != null ? '<span class="bmi">BMI ' + fmt(b) + "</span> " : "") + "<span>" + md(latest[0]) + " " + ds + "</span></div>" + gl + "</div>";
    }).join("");
  }

  // 目標の行: 「目標 54.0kg・12/31(木)まで」「あと 1.8kg・残り58日」（減らす目標として数える）
  function goalLine(k, latest) {
    const g = goals[k];
    if (!g || num(g.weight) == null) return '<div class="g">目標はまだありません</div>';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((parse(g.date).getTime() - today.getTime()) / 86400000);
    const head = "<span>目標 " + fmt(g.weight) + "kg</span> <span>" + md(g.date) + "まで</span>";
    if (latest == null) return '<div class="g">' + head + "</div>";
    const rest = Math.round((latest - g.weight) * 10) / 10;
    if (rest <= 0) return '<div class="g done">' + head + "<br><b>目標達成！</b></div>";
    const when = days > 0 ? "残り" + days + "日" : days === 0 ? "今日まで" : "期限を過ぎました";
    return '<div class="g">' + head + "<br><span>あと <b>" + rest.toFixed(1) + "kg</b></span> <span>" + when + "</span></div>";
  }

  function niceStep(span, maxTicks) {
    const steps = [0.2, 0.5, 1, 2, 5, 10];
    for (const s of steps) if (span / s <= maxTicks) return s;
    return 20;
  }

  function renderChart() {
    const box = $("chart");
    const dates = inRange();
    renderStats(dates);
    if (!loaded) return;
    const series = PEOPLE.map((p) => ({ p: p, pts: dates.map((d) => ({ d: d, v: num(rows.get(d)[p.key]) })).filter((x) => x.v != null) }));
    const all = series.flatMap((s) => s.pts);
    if (!all.length) {
      box.innerHTML = '<div class="empty">' + (rows.size ? "この期間の記録はありません。期間を広げてみてください。" : "まだ記録がありません。下の「記録する」で最初の体重を入れると、ここに折れ線グラフが出ます。") + "</div>";
      return;
    }
    const W = Math.max(260, Math.round(box.clientWidth || 600)), H = Math.max(120, Math.round(box.clientHeight || 240)); // 枠の大きさに合わせる
    const bk = who(), showBmi = num(heights[bk]) != null; // 選んでいる人のBMI目盛りを右端に出す
    const m = { l: 34, r: showBmi ? 36 : 12, t: 18, b: 22 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const gls = PEOPLE.filter((p) => goals[p.key] && num(goals[p.key].weight) != null).map((p) => ({ p: p, v: goals[p.key].weight }));
    const vals = all.map((x) => x.v).concat(gls.map((g) => g.v)); // 目標の線もグラフに入るように
    let vmin = Math.min(...vals), vmax = Math.max(...vals);
    if (vmax - vmin < 1) { const c = (vmax + vmin) / 2; vmin = c - 0.5; vmax = c + 0.5; }
    const step = niceStep(vmax - vmin, Math.max(3, Math.floor(ih / 30))); // 縦の目盛りは高さに合わせた数まで
    vmin = Math.floor((vmin - step * 0.3) / step) * step;
    vmax = Math.ceil((vmax + step * 0.3) / step) * step;
    const t0 = parse(dates[0]).getTime(), t1 = parse(dates[dates.length - 1]).getTime();
    const tspan = Math.max(t1 - t0, 86400000);
    const x = (d) => m.l + (dates.length === 1 ? iw / 2 : ((parse(d).getTime() - t0) / tspan) * iw);
    const y = (v) => m.t + (1 - (v - vmin) / (vmax - vmin)) * ih;
    let s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="オリシとぽこしの体重の折れ線グラフ">';
    // 横の目盛り
    const dec = step < 1 ? 1 : 0;
    for (let v = vmin; v <= vmax + 1e-9; v += step) {
      const yy = y(v).toFixed(1);
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>';
      s += '<text x="' + (m.l - 6) + '" y="' + yy + '" dy="0.35em" text-anchor="end" font-size="11" fill="var(--muted)">' + v.toFixed(dec) + "</text>";
      if (showBmi) s += '<text x="' + (W - 2) + '" y="' + yy + '" dy="0.35em" text-anchor="end" font-size="11" font-weight="700" fill="' + colorOf(bk) + '">' + fmt(bmi(v, bk)) + "</text>";
    }
    s += '<text x="' + (m.l - 6) + '" y="10" text-anchor="end" font-size="10" fill="var(--muted)">kg</text>';
    if (showBmi) s += '<text x="' + (W - 2) + '" y="10" text-anchor="end" font-size="10" font-weight="700" fill="' + colorOf(bk) + '">' + nameOf(bk) + "のBMI</text>";
    // 日付の目盛り（最大5つ）
    const nTicks = Math.min(5, dates.length, Math.max(2, Math.floor(iw / 62))); // 日付が重ならない数まで
    const used = new Set();
    for (let i = 0; i < nTicks; i++) {
      const idx = nTicks === 1 ? 0 : Math.round((i * (dates.length - 1)) / (nTicks - 1));
      if (used.has(idx)) continue; used.add(idx);
      const d = dates[idx], xx = x(d), dd = parse(d);
      const anchor = nTicks === 1 ? "middle" : i === 0 ? "start" : i === nTicks - 1 ? "end" : "middle";
      s += '<text x="' + xx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '" font-size="11" fill="var(--muted)">' + (dd.getMonth() + 1) + "/" + dd.getDate() + "</text>";
    }
    // 目標の線（その人の色の点線）
    gls.forEach((g) => {
      const yy = y(g.v).toFixed(1);
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + g.p.color + '" stroke-width="1.5" stroke-dasharray="6 4" opacity=".85"/>';
      s += '<text x="' + (m.l + 4) + '" y="' + (Number(yy) - 4) + '" font-size="10" font-weight="700" fill="' + g.p.color + '">' + g.p.name + "の目標 " + fmt(g.v) + "</text>";
    });
    // 線と点
    series.forEach((sr) => {
      if (!sr.pts.length) return;
      const path = sr.pts.map((q, i) => (i ? "L" : "M") + x(q.d).toFixed(1) + " " + y(q.v).toFixed(1)).join(" ");
      s += '<path d="' + path + '" fill="none" stroke="' + sr.p.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      const showDots = sr.pts.length <= 60;
      sr.pts.forEach((q, i) => {
        const last = i === sr.pts.length - 1;
        const cx = x(q.d).toFixed(1), cy = y(q.v).toFixed(1), tip = sr.p.name + " " + label(q.d) + " " + fmt(q.v) + "kg";
        s += '<g class="pt" data-date="' + q.d + '" data-who="' + sr.p.key + '" tabindex="0" role="button" aria-label="' + tip + ' を直す・消す"><title>' + tip + "（タップで直す・消す）</title>";
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="12" fill="transparent"/>';
        if (showDots || last) s += '<circle class="mark" cx="' + cx + '" cy="' + cy + '" r="' + (last ? 4.5 : 3) + '" fill="' + (last ? sr.p.color : "var(--surface)") + '" stroke="' + sr.p.color + '" stroke-width="2"/>';
        s += "</g>";
      });
    });
    // 最新の数字は上の色つきの枠に出ているので、グラフの中には書かない（右端の目盛りと重なるため）
    s += "</svg>";
    box.innerHTML = s;
  }

  function renderList() {
    const dates = sortedDates().reverse();
    const body = $("rows");
    if (!dates.length) { body.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);cursor:default">' + (loaded ? "まだ記録がありません" : "読み込み中…") + "</td></tr>"; $("more").hidden = true; return; }
    body.innerHTML = dates.slice(0, listLimit).map((d) => {
      const r = rows.get(d);
      const cell = (k) => { const v = num(r[k]); if (v == null) return '<td class="none">—</td>'; const b = bmi(v, k); return "<td>" + fmt(v) + (b != null ? '<span class="b">BMI ' + fmt(b) + "</span>" : "") + "</td>"; };
      return '<tr data-date="' + d + '"' + (d === $("date").value ? ' class="sel"' : "") + "><td>" + fullLabel(d) + "</td>" + cell("orishi") + cell("pokoshi") + "</tr>";
    }).join("");
    $("more").hidden = dates.length <= listLimit;
  }

  // その日・その人の記録を入力欄に出す（直す・消す用）
  function openEntry(date, k) {
    $("date").value = date;
    if (k) $("who-" + k).checked = true;
    store("who", who());
    syncForm(); setStatus(""); renderChart();
    if ($("hist").open) $("hist").close();
    $("weight").focus({ preventScroll: true });
  }

  // ---- 履歴（下から出す一覧） ----
  $("open-hist").addEventListener("click", () => { renderList(); $("hist").showModal(); $("hist").querySelector(".hist-body").scrollTop = 0; });
  $("close-hist").addEventListener("click", () => $("hist").close());
  $("hist").addEventListener("click", (e) => { if (e.target === $("hist")) $("hist").close(); }); // 暗いところを押しても閉じる

  $("rows").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-date]"); if (!tr) return;
    const r = rows.get(tr.dataset.date);
    // 押した列の人に合わせる（記録がある方）
    const td = e.target.closest("td"), ci = td ? Array.from(tr.children).indexOf(td) : 0;
    let k = null;
    if (ci === 1) k = "orishi";
    else if (ci === 2) k = "pokoshi";
    else if (r && num(r[who()]) == null) { const o = who() === "orishi" ? "pokoshi" : "orishi"; if (num(r[o]) != null) k = o; }
    openEntry(tr.dataset.date, k);
  });

  $("chart").addEventListener("click", (e) => {
    const g = e.target.closest(".pt"); if (!g) return;
    openEntry(g.dataset.date, g.dataset.who);
  });
  $("chart").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest(".pt"); if (!g) return;
    e.preventDefault();
    openEntry(g.dataset.date, g.dataset.who);
  });

  function renderAll() { renderList(); renderChart(); syncForm(document.activeElement === $("weight") && $("weight").value !== ""); }

  let rt = null, lastSize = "";
  const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { const b = $("chart"), s = b.clientWidth + "x" + b.clientHeight; if (s !== lastSize) { lastSize = s; renderChart(); } }, 120); };
  if (window.ResizeObserver) new ResizeObserver(onResize).observe($("chart"));
  else window.addEventListener("resize", onResize);

  // ---- データ接続 ----
  renderList(); renderStats([]); syncForm();
  $("save").disabled = true;

  // 記録はGoogleスプレッドシート（Apps Script）に保存する。
  // 保存先と合言葉は設定リンクの # の後ろ（#c=保存先ID.合言葉）で受け取り、この端末にも覚えておく。
  // # はサーバーに送られないので、リポジトリにもGitHubにも残らない。
  function readConfig() {
    const m = location.hash.match(/c=([\w-]+)\.([\w-]+)/);
    if (m) { store("cfg", m[1] + "." + m[2]); return { id: m[1], k: m[2] }; }
    const s = recall("cfg"), n = s && s.match(/^([\w-]+)\.([\w-]+)$/);
    return n ? { id: n[1], k: n[2] } : null;
  }

  async function call(body) {
    const url = "https://script.google.com/macros/s/" + cfg.id + "/exec";
    const res = body
      ? await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ k: cfg.k }, body)) })
      : await fetch(url + "?k=" + encodeURIComponent(cfg.k) + "&t=" + Date.now());
    const j = await res.json();
    if (!j.ok) { const e = new Error(j.error); e.code = j.error; throw e; }
    return j;
  }

  function apply(data) {
    const list = Array.isArray(data) ? data : data.rows;
    if (data && data.goals) { goals = data.goals; store("goals", JSON.stringify(goals)); }
    rows.clear();
    list.forEach((r) => {
      if (r && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && (num(r.orishi) != null || num(r.pokoshi) != null)) rows.set(r.date, r);
    });
    store("rows", JSON.stringify(list));
    loaded = true;
    renderAll();
  }

  async function load() {
    if (!cfg || busy) return;
    try {
      const list = await call();
      if (busy) return; // 読み込み中に保存した場合は、保存の結果を優先する
      ready = true; notice("");
      apply(list);
    } catch (err) {
      if (err && err.code === "auth") { ready = false; notice("記録につながりませんでした。設定リンクが古いようです。ぽこしから新しい設定リンクをもらって開き直してください。", true); }
      else notice("記録を読み込めませんでした。通信状態を確かめて、開き直してください。" + (rows.size ? "（下はこの端末に残っている前回の記録です）" : ""), true);
      loaded = true; renderAll();
    }
  }

  // 開いたままのページで新しい設定リンクを開いたときも、読み直す
  window.addEventListener("hashchange", () => { const c = readConfig(); if (c) { cfg = c; load(); } });

  cfg = readConfig();
  if (!cfg) {
    loaded = true;
    notice("このページはまだ設定されていません。ぽこしから送られた「設定リンク」を開いてください。", true);
    renderAll();
  } else {
    try { const g = JSON.parse(recall("goals") || "null"); if (g && typeof g === "object") goals = g; } catch (e) {}
    try { const cached = JSON.parse(recall("rows") || "null"); if (Array.isArray(cached)) apply(cached); } catch (e) {}
    load();
    // アプリに戻ってきたときと、開いたままのときは2分ごとに、相手の記録を読み直す
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
    setInterval(() => { if (document.visibilityState === "visible") load(); }, 120000);
  }
})();
</script>
</body>
</html>
